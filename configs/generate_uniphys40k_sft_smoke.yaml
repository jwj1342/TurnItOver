  manifest: data/assets/uniphys40k-trainval-v3/catalog.json
clean_fraction: 0.25
max_corruptions: 2
corruptions: [structure.part_offset, kinematics.joint_axis]
budget: null
observation_script:
  - {type: request_view, view_id: front}
