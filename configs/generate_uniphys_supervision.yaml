run_id: uniphys_supervision_v1
seed: 20261011
n_samples: 480
asset_source:
  kind: catalog
  manifest: data/assets/uniphys40k-trainval-v1/catalog.json
clean_fraction: 0.25
max_corruptions: 2
corruptions: [structure.part_offset, kinematics.joint_axis]
budget: null
observation_script:
  - {type: request_view, view_id: front}
  - {type: request_view, view_id: oblique_fr}
  - {type: actuate_joint, joint_id: "*", detent: mid}
  - {type: actuate_joint, joint_id: "*", detent: limit}
  - {type: stop}
evidence_states: [rest, "joint:*:mid", "joint:*:limit"]
checkers:
  geometry.alignment: {tol_chamfer_m: 0.005, tol_iou: 0.9, samples_per_part: 1000}
  runtime.budget: {max_triangles: 1000000, max_draw_calls: 1024}
render: {width: 256, height: 256}
views: configs/views.yaml
output_dir: data/benchmarks/uniphys-supervision-v1/raw
